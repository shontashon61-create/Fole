name: AIChat
options:
  bundleIdPrefix: com.custom
  deploymentTarget:
    iOS: "16.0"
targets:
  AIChat:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Нужен доступ к галерее для прикрепления фото"
        NSCameraUsageDescription: "Нужен доступ к камере, чтобы делать фото прямо в чате"
        NSMicrophoneUsageDescription: "Нужен доступ к микрофону для голосового ввода"
        NSSpeechRecognitionUsageDescription: "Нужен доступ для перевода речи в текст"
        UIApplicationSupportsIndirectInputEvents: true
