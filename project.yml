name: AIChat
options:
  bundleIdPrefix: com.custom
  deploymentTarget:
    iOS: "16.0"
targets:
  AIChat:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Доступ к фото нужен для отправки изображений в чат с ИИ"
        NSMicrophoneUsageDescription: "Доступ к микрофону нужен для голосового ввода сообщений"
        NSSpeechRecognitionUsageDescription: "Распознавание речи нужно для перевода голоса в текст"
        UIApplicationSupportsIndirectInputEvents: true
