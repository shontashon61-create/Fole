name: AIChat
options:
  bundleIdPrefix: com.custom
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "16.0"
targets:
  AIChat:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Доступ к фото нужен для отправки изображений в чат с ИИ"
        UIApplicationSupportsIndirectInputEvents: true
